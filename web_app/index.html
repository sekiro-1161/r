<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burger House</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="app">
        <!-- Шапка -->
        <header class="header">
            <div class="header-content">
                <h1>🍔 Burger House</h1>
                <p class="subtitle">Вкусные бургеры каждый день</p>
            </div>
        </header>

        <!-- Основной контент -->
        <main class="main">
            <!-- Меню бургеров -->
            <section class="menu-section" id="menuSection">
                <h2>Наше меню</h2>
                <div class="burgers-grid" id="burgersGrid"></div>
                
                <h2>Дополнения</h2>
                <div class="extras-grid" id="extrasGrid"></div>
            </section>

            <!-- Корзина -->
            <section class="cart-section" id="cartSection" style="display: none;">
                <h2>🛒 Ваша корзина</h2>
                <div class="cart-items" id="cartItems"></div>
                <div class="cart-total" id="cartTotal">Итого: 0₽</div>
                
                <div class="payment-methods">
                    <h3>Способ оплаты:</h3>
                    <div class="payment-buttons">
                        <button class="payment-btn online-btn" onclick="selectPayment('online')">
                            💳 Онлайн (ЮMoney)
                        </button>
                        <button class="payment-btn cash-btn" onclick="selectPayment('cash')">
                            💵 Наличными
                        </button>
                    </div>
                </div>

                <div class="cart-actions">
                    <button class="order-btn" onclick="createOrder()" id="orderBtn" disabled>
                        Оформить заказ
                    </button>
                    <button class="clear-btn" onclick="clearCart()">
                        Очистить корзину
                    </button>
                </div>
            </section>
        </main>

        <!-- Нижняя навигация -->
        <nav class="bottom-nav">
            <button class="nav-btn active" onclick="showSection('menu')">
                <span class="nav-icon">🍔</span>
                <span class="nav-text">Меню</span>
            </button>
            <button class="nav-btn" onclick="showSection('cart')">
                <span class="nav-icon">🛒</span>
                <span class="nav-text">Корзина</span>
                <span class="cart-badge" id="cartBadge" style="display: none;">0</span>
            </button>
        </nav>
    </div>

    <!-- Уведомления -->
    <div class="notification" id="notification"></div>

    <script src="app.js"></script>
</body>
</html>
