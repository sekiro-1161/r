<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Суши-Бургер</title>
    
    <!-- Telegram Web App SDK - загружается асинхронно -->
    <script src="https://telegram.org/js/telegram-web-app.js" async></script>
    
    <style>
        /* Базовые стили - минимум для быстрого старта */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background: #f8f9fa; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 10px; }
        
        .app {
            max-width: 450px; width: 100%; height: 95vh; background: #f8f9fa;
            border-radius: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden; display: flex; flex-direction: column;
        }
        
        /* Шапка - минимальная */
        .header {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            padding: 15px; color: white; text-align: center;
        }
        
        .header h1 { font-size: 24px; margin-bottom: 5px; }
        
        /* Категории - скролл */
        .categories {
            display: flex; overflow-x: auto; padding: 15px; gap: 10px;
            background: white; border-bottom: 1px solid #eee;
            scrollbar-width: thin;
        }
        
        .category-btn {
            padding: 10px 20px; border: none; border-radius: 25px;
            background: #f1f2f6; font-weight: 600; cursor: pointer;
            flex-shrink: 0; transition: 0.2s;
        }
        
        .category-btn.active {
            background: #e74c3c; color: white;
        }
        
        /* Контент */
        .main { flex: 1; overflow-y: auto; padding: 15px; }
        
        /* Сетка товаров */
        .items-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px; margin-bottom: 20px;
        }
        
        /* Карточка товара - легкая */
        .item-card {
            background: white; border-radius: 16px; padding: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex; flex-direction: column;
        }
        
        .item-name { font-weight: 700; color: #2d3436; font-size: 15px; margin-bottom: 4px; }
        .item-description { font-size: 11px; color: #7f8c8d; margin-bottom: 8px; }
        .item-price { font-weight: 700; color: #e74c3c; font-size: 18px; margin-bottom: 8px; }
        
        .add-to-cart {
            background: #27ae60; color: white; border: none;
            padding: 8px; border-radius: 20px; font-weight: 600;
            cursor: pointer; transition: 0.2s;
        }
        
        /* Корзина */
        .cart-section { padding: 15px; }
        .cart-total {
            background: #2c3e50; color: white; padding: 15px;
            border-radius: 12px; text-align: center; font-size: 18px;
            margin-bottom: 15px;
        }
        
        .payment-btn {
            flex: 1; padding: 12px; border: 2px solid #ecf0f1;
            border-radius: 12px; background: white; cursor: pointer;
        }
        
        .payment-btn.active {
            background: #e74c3c; color: white; border-color: #e74c3c;
        }
        
        .order-btn {
            background: #27ae60; color: white; border: none;
            padding: 15px; border-radius: 12px; font-weight: 600;
            cursor: pointer; width: 100%;
        }
        
        .order-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* Нижняя навигация */
        .bottom-nav {
            background: white; display: flex; padding: 10px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.05);
        }
        
        .nav-btn {
            flex: 1; background: none; border: none; cursor: pointer;
            display: flex; flex-direction: column; align-items: center;
            color: #b2bec3; transition: 0.2s;
        }
        
        .nav-btn.active { color: #e74c3c; }
        .nav-icon { font-size: 24px; }
        .nav-text { font-size: 11px; }
        .cart-badge {
            position: absolute; background: #e74c3c; color: white;
            border-radius: 50%; width: 18px; height: 18px;
            font-size: 10px; display: flex; align-items: center; justify-content: center;
        }
        
        /* Уведомления */
        .notification {
            position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
            background: #2c3e50; color: white; padding: 10px 20px;
            border-radius: 50px; display: none; z-index: 1000;
        }
        
        .notification.show { display: block; }
        
        /* Индикатор загрузки */
        .loading {
            text-align: center; padding: 30px; color: #7f8c8d;
            font-size: 14px;
        }
        
        @media (max-width: 480px) {
            .app { height: 100vh; border-radius: 0; }
            .items-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <h1>🍣 Суши-Бургер</h1>
            <div id="welcomeMessage" style="font-size: 13px;">Загрузка...</div>
        </header>

        <!-- Категории -->
        <div class="categories" id="categories">
            <button class="category-btn active" data-cat="rolls">🍣 Роллы</button>
            <button class="category-btn" data-cat="pizza">🍕 Пицца</button>
            <button class="category-btn" data-cat="snacks">🍟 Закуски</button>
            <button class="category-btn" data-cat="drinks">🥤 Напитки</button>
            <button class="category-btn" data-cat="combo">🍱 Комбо</button>
        </div>

        <main class="main" id="main">
            <!-- Здесь будет динамически подгружаться меню -->
            <div class="loading" id="loadingIndicator">⏳ Загрузка меню...</div>
        </main>

        <!-- Корзина (скрыта) -->
        <div class="cart-section" id="cartSection" style="display: none;"></div>

        <!-- Нижняя навигация -->
        <nav class="bottom-nav">
            <button class="nav-btn active" id="menuNavBtn">
                <span class="nav-icon">🍣</span>
                <span class="nav-text">Меню</span>
            </button>
            <button class="nav-btn" id="cartNavBtn">
                <span class="nav-icon">🛒</span>
                <span class="nav-text">Корзина</span>
                <span class="cart-badge" id="cartBadge" style="display: none;">0</span>
            </button>
        </nav>
    </div>

    <div class="notification" id="notification"></div>

    <script>
        // Оптимизированный JavaScript
        (function() {
            console.log('🚀 Mini App запускается...');
            
            // Telegram Web App
            let tg = window.Telegram?.WebApp;
            if (tg) {
                tg.ready();
                tg.expand();
                document.getElementById('welcomeMessage').innerText = 
                    tg.initDataUnsafe?.user ? `👋 Привет, ${tg.initDataUnsafe.user.first_name}!` : 'Добро пожаловать!';
            } else {
                document.getElementById('welcomeMessage').innerText = 'Демо-режим';
            }
            
            // Меню (только названия и цены - ничего лишнего)
            const MENU = {
                rolls: [
                    { id: 'philadelphia', name: 'ФИЛАДЕЛЬФИЯ', desc: 'Рис, норн, сыр, лосось', price: 38 },
                    { id: 'bekono', name: 'БЕКОНО МАКИ', desc: 'Рис, норн, огурец, сыр, бекон', price: 38 },
                    { id: 'syake', name: 'СЯКЕ МАКИ', desc: 'Рис, лосось, норн', price: 20 },
                    { id: 'kappa', name: 'КАППА МАКИ', desc: 'Рис, огурец, норн', price: 20 },
                    { id: 'voskhod', name: 'ВОСХОДЯЩЕЕ СОЛНЦЕ', desc: 'Рис, норн, креветка, икра, сыр', price: 38 }
                ],
                pizza: [
                    { id: 'margarita', name: 'МАРГАРИТА', desc: 'Томатный соус, помидоры, сыр', price: 350 },
                    { id: 'peperoni', name: 'ПЕПЕРОНИ', desc: 'Томатный соус, пеперони, сыр', price: 350 },
                    { id: 'myasnaya', name: 'МЯСНАЯ', desc: 'Ветчина, пеперони, бекон, сыр', price: 450 }
                ],
                snacks: [
                    { id: 'fries', name: 'ФРИ', desc: 'Картофель фри + кетчуп', price: 100 },
                    { id: 'naggets', name: 'НАГГЕТСЫ', desc: 'Куриные наггетсы', price: 150 },
                    { id: 'burger', name: 'БУРГЕР', desc: 'С наггетсами или котлетой', price: 150 }
                ],
                drinks: [
                    { id: 'water', name: 'ВОДА 0.5', desc: 'Питьевая вода', price: 50 },
                    { id: 'cola', name: 'КОЛА 0.5', desc: 'Кола', price: 100 }
                ],
                combo: [
                    { id: 'combo', name: 'КОМБО', desc: 'Нагетсы + фри + соус', price: 150 }
                ]
            };
            
            // Состояние
            let cart = [];
            let currentCategory = 'rolls';
            let selectedPayment = null;
            
            // Быстрый рендер категории
            function renderCategory(category) {
                const items = MENU[category] || [];
                const main = document.getElementById('main');
                const loading = document.getElementById('loadingIndicator');
                
                if (loading) loading.style.display = 'none';
                
                let html = `<h2 style="margin:0 0 15px 0;">${
                    category === 'rolls' ? '🍣 Роллы' :
                    category === 'pizza' ? '🍕 Пицца' :
                    category === 'snacks' ? '🍟 Закуски' :
                    category === 'drinks' ? '🥤 Напитки' : '🍱 Комбо'
                }</h2>`;
                
                html += '<div class="items-grid">';
                
                for (let item of items) {
                    html += `
                        <div class="item-card">
                            <div class="item-name">${item.name}</div>
                            <div class="item-description">${item.desc}</div>
                            <div class="item-price">${item.price}₽</div>
                            <button class="add-to-cart" 
                                data-id="${item.id}"
                                data-name="${item.name}"
                                data-price="${item.price}">
                                🛒 В корзину
                            </button>
                        </div>
                    `;
                }
                
                html += '</div>';
                main.innerHTML = html;
            }
            
            // Показать первую категорию сразу
            renderCategory('rolls');
            
            // Переключение категорий
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    renderCategory(this.dataset.cat);
                });
            });
            
            // Добавление в корзину
            document.addEventListener('click', function(e) {
                if (e.target.classList.contains('add-to-cart')) {
                    const item = {
                        id: e.target.dataset.id,
                        name: e.target.dataset.name,
                        price: parseInt(e.target.dataset.price)
                    };
                    cart.push(item);
                    
                    const badge = document.getElementById('cartBadge');
                    badge.style.display = 'flex';
                    badge.textContent = cart.length;
                    
                    showNotification(`✅ ${item.name} добавлен`);
                    if (tg) tg.HapticFeedback?.impactOccurred('light');
                }
            });
            
            // Навигация
            document.getElementById('menuNavBtn').addEventListener('click', function() {
                document.getElementById('menuNavBtn').classList.add('active');
                document.getElementById('cartNavBtn').classList.remove('active');
                document.getElementById('main').style.display = 'block';
                document.getElementById('cartSection').style.display = 'none';
                document.querySelector('.categories').style.display = 'flex';
            });
            
            document.getElementById('cartNavBtn').addEventListener('click', function() {
                document.getElementById('menuNavBtn').classList.remove('active');
                document.getElementById('cartNavBtn').classList.add('active');
                document.querySelector('.categories').style.display = 'none';
                document.getElementById('main').style.display = 'none';
                document.getElementById('cartSection').style.display = 'block';
                showCart();
            });
            
            // Показать корзину
            function showCart() {
                if (cart.length === 0) {
                    document.getElementById('cartSection').innerHTML = `
                        <h2>🛒 Корзина пуста</h2>
                        <button class="order-btn" onclick="document.getElementById('menuNavBtn').click()">
                            🍣 В меню
                        </button>
                    `;
                    return;
                }
                
                let total = 0;
                let itemsHtml = '';
                
                for (let item of cart) {
                    total += item.price;
                    itemsHtml += `
                        <div style="background:white; padding:12px; border-radius:12px; margin-bottom:8px;">
                            <div style="font-weight:600;">${item.name}</div>
                            <div style="color:#e74c3c;">${item.price}₽</div>
                        </div>
                    `;
                }
                
                document.getElementById('cartSection').innerHTML = `
                    <h2>🛒 Корзина</h2>
                    <div style="margin-bottom:20px;">${itemsHtml}</div>
                    <div class="cart-total">Итого: ${total}₽</div>
                    
                    <div style="margin-bottom:20px;">
                        <h3>💳 Оплата:</h3>
                        <div style="display:flex; gap:10px;">
                            <button class="payment-btn" id="onlinePay">💳 Онлайн</button>
                            <button class="payment-btn" id="cashPay">💵 Наличными</button>
                        </div>
                    </div>
                    
                    <button class="order-btn" id="orderBtn" disabled>✅ Оформить</button>
                    <button class="order-btn" id="clearBtn" style="background:#95a5a6; margin-top:10px;">🗑️ Очистить</button>
                `;
                
                // Обработчики
                document.getElementById('onlinePay').addEventListener('click', function() {
                    selectedPayment = 'online';
                    document.getElementById('onlinePay').classList.add('active');
                    document.getElementById('cashPay').classList.remove('active');
                    document.getElementById('orderBtn').disabled = false;
                });
                
                document.getElementById('cashPay').addEventListener('click', function() {
                    selectedPayment = 'cash';
                    document.getElementById('onlinePay').classList.remove('active');
                    document.getElementById('cashPay').classList.add('active');
                    document.getElementById('orderBtn').disabled = false;
                });
                
                document.getElementById('orderBtn').addEventListener('click', function() {
                    if (tg) {
                        tg.sendData(JSON.stringify({
                            action: 'create_order',
                            items: cart,
                            total: total,
                            payment_method: selectedPayment
                        }));
                        showNotification('✅ Заказ отправлен!');
                        setTimeout(() => tg.close(), 1000);
                    } else {
                        alert('Заказ оформлен!');
                    }
                });
                
                document.getElementById('clearBtn').addEventListener('click', function() {
                    cart = [];
                    selectedPayment = null;
                    document.getElementById('cartBadge').style.display = 'none';
                    showCart();
                });
            }
            
            // Уведомления
            function showNotification(msg) {
                const notif = document.getElementById('notification');
                notif.textContent = msg;
                notif.classList.add('show');
                setTimeout(() => notif.classList.remove('show'), 1500);
            }
        })();
    </script>
</body>
</html>
