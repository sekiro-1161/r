<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sole Mio</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial; padding: 20px; background: #f0f0f0; }
        button { 
            background: #e74c3c; 
            color: white; 
            border: none; 
            padding: 15px 30px; 
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin: 10px 0;
        }
        .cart-item {
            background: white;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
        }
        .total {
            font-size: 20px;
            font-weight: bold;
            margin: 20px 0;
            text-align: right;
        }
        select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>🍕 SOLE MIO</h1>
    <p id="userStatus">Загрузка...</p>
    
    <h2>Меню</h2>
    <button onclick="addToCart('Пицца Маргарита', 450)">🍕 Маргарита - 450₽</button>
    <button onclick="addToCart('Ролл Филадельфия', 380)">🍣 Филадельфия - 380₽</button>
    
    <h2>Корзина</h2>
    <div id="cart"></div>
    <div class="total" id="total">Итого: 0₽</div>
    
    <h3>Способ оплаты:</h3>
    <select id="payment">
        <option value="cash">💵 Наличные</option>
        <option value="online">💳 Онлайн (ЮMoney)</option>
    </select>
    
    <button onclick="createOrder()" style="background: #27ae60;">✅ Оформить заказ</button>
    
    <script>
        const tg = window.Telegram?.WebApp;
        let cart = [];
        let total = 0;
        
        // Инициализация Telegram
        if (tg) {
            tg.ready();
            tg.expand();
            const user = tg.initDataUnsafe?.user;
            document.getElementById('userStatus').innerText = user 
                ? `👋 Привет, ${user.first_name}!` 
                : 'Добро пожаловать!';
            console.log('✅ Telegram Web App готов');
        } else {
            document.getElementById('userStatus').innerText = '⚠️ Запущено вне Telegram';
        }
        
        // Добавление в корзину
        window.addToCart = function(name, price) {
            cart.push({ name, price });
            total = cart.reduce((sum, item) => sum + item.price, 0);
            updateCartDisplay();
            console.log('Корзина:', cart);
        };
        
        // Обновление отображения корзины
        function updateCartDisplay() {
            const cartDiv = document.getElementById('cart');
            cartDiv.innerHTML = '';
            cart.forEach((item, index) => {
                cartDiv.innerHTML += `
                    <div class="cart-item">
                        <span>${item.name}</span>
                        <span>${item.price}₽ 
                            <button onclick="removeFromCart(${index})" style="background:#e74c3c; color:white; border:none; border-radius:50%; width:25px; height:25px;">✕</button>
                        </span>
                    </div>
                `;
            });
            document.getElementById('total').innerText = `Итого: ${total}₽`;
        }
        
        // Удаление из корзины
        window.removeFromCart = function(index) {
            cart.splice(index, 1);
            total = cart.reduce((sum, item) => sum + item.price, 0);
            updateCartDisplay();
        };
        
        // Оформление заказа
        window.createOrder = function() {
            if (cart.length === 0) {
                alert('Корзина пуста!');
                return;
            }
            
            const paymentMethod = document.getElementById('payment').value;
            
            const orderData = {
                action: 'create_order',
                items: cart.map(item => ({
                    name: item.name,
                    price: item.price
                })),
                total: total,
                payment_method: paymentMethod
            };
            
            console.log('📦 Отправка заказа:', orderData);
            
            if (tg) {
                tg.sendData(JSON.stringify(orderData));
                alert('✅ Заказ отправлен! Проверьте чат с ботом.');
                
                // Очищаем корзину
                cart = [];
                total = 0;
                updateCartDisplay();
            } else {
                alert('Демо-режим. Заказ:\n' + JSON.stringify(orderData, null, 2));
            }
        };
    </script>
</body>
</html>
